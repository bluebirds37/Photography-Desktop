[package]
name = "timelapse_assistant"
version = "0.1.0"
edition = "2021"
description = "A standalone timelapse post-production suite built with Rust and GPUI"

[features]
default = ["rawler"]
rawler = ["dep:rawler"]

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", features = ["jpeg", "png", "tiff", "webp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
kamadak-exif = "0.6"
rawler = { version = "0.6", optional = true }
rfd = "0.15"
crossbeam-channel = "0.5"
num_cpus = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
